<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PromptPolish</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      padding: 16px;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }
    .header {
      font-variant: small-caps;
      letter-spacing: 0.08em;
      color: #888;
      font-size: 14px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #ccc;
    }
    input {
      width: 100%;
      padding: 8px;
      background: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status {
      min-height: 16px;
      margin-top: 8px;
      font-size: 12px;
    }
    .ok { color: #22c55e; }
    .err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">PromptPolish</div>
  <label for="key">OpenAI API Key</label>
  <input id="key" type="password" placeholder="Paste your API key" autocomplete="off" spellcheck="false" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
