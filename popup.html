<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>polishd</title>
  <style>
    /* Bundled with the extension (fonts/, OFL) so the popup never depends on a CDN. */
    @font-face {
      font-family: 'Space Grotesk';
      src: url('fonts/SpaceGrotesk-latin.woff2') format('woff2');
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      text-transform: lowercase;
    }
    /* Typed values keep their real case; only the UI text is lowercase. */
    input, textarea { text-transform: none; font-family: inherit; }
    ::placeholder { text-transform: lowercase; color: #666; }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 32px;
      line-height: 1;
      color: #FF8C00;
      margin-bottom: 8px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #FF8C00;
    }
    .tagline {
      margin-top: 2px;
      font-size: 11px;
      color: #777;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #bbb;
      font-size: 12px;
    }
    input, textarea {
      display: block;
      width: 100%;
      padding: 8px;
      background: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 150ms ease;
    }
    input:focus, textarea:focus { border-color: #FF8C00; }
    textarea {
      min-height: 64px;
      resize: vertical;
      line-height: 1.4;
    }
    .section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #222;
    }
    .section label { font-size: 11px; color: #999; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      background: #FF8C00;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      text-transform: lowercase;
      cursor: pointer;
      transition: filter 150ms ease, transform 150ms ease;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.98); }
    .status {
      min-height: 16px;
      margin-top: 10px;
      font-size: 12px;
    }
    .ok { color: #FF8C00; }
    .err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo" aria-hidden="true">&#x26A1;&#xFE0E;</div>
    <div class="title">polishd</div>
    <div class="tagline">rewrite prompts instantly</div>
  </div>
  <label for="key">gemini api key</label>
  <input id="key" type="password" placeholder="paste your gemini api key" autocomplete="off" spellcheck="false" />
  <button id="save">save</button>
  <div id="status" class="status"></div>

  <div class="section">
    <label for="custom">custom mode prompt</label>
    <textarea id="custom" placeholder="e.g. rewrite this as a tweet thread" spellcheck="false"></textarea>
    <button id="save-custom">save prompt</button>
    <div id="custom-status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
