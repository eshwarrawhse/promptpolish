<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PromptPolish</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      font-size: 32px;
      line-height: 1;
      color: #FF8C00;
      margin-bottom: 8px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #FF8C00;
    }
    .tagline {
      margin-top: 2px;
      font-size: 11px;
      color: #777;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #bbb;
      font-size: 12px;
    }
    input {
      width: 100%;
      padding: 8px;
      background: #222;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 150ms ease;
    }
    input:focus { border-color: #FF8C00; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      background: #FF8C00;
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 150ms ease, transform 150ms ease;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.98); }
    #status {
      min-height: 16px;
      margin-top: 10px;
      font-size: 12px;
    }
    .ok { color: #FF8C00; }
    .err { color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo" aria-hidden="true">&#x26A1;&#xFE0E;</div>
    <div class="title">PromptPolish</div>
    <div class="tagline">Rewrite prompts instantly</div>
  </div>
  <label for="key">Gemini API Key</label>
  <input id="key" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
